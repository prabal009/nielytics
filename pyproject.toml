[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "nielytics"
version = "0.1.0"
description = "Reusable analytics foundation for ClimateLens India"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2,<3",
  "scipy>=1.12",
  "openpyxl>=3.1",
  "pyarrow>=15",
  "plotly>=5.24",
  "matplotlib>=3.9",
  "geopandas>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/nielytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
