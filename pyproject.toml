[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "nielytics"
version = "0.2.0.dev1"
description = "Reusable climate hazard and disaster analytics library for India (v2.0)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2,<3",
  "scipy>=1.12",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
parquet = ["pyarrow>=15"]
visualization = ["plotly>=5.24", "matplotlib>=3.9"]
geospatial = ["geopandas>=1.0", "shapely>=2.0", "pyproj>=3.6"]
raster = ["rasterio>=1.3", "xarray>=2024.1"]
climate = ["xarray>=2024.1", "netCDF4>=1.6"]
advanced-statistics = ["statsmodels>=0.14", "scikit-learn>=1.4"]
dev = ["pytest>=8", "pytest-cov>=4", "ruff>=0.9", "build>=1.2"]
all = [
  "openpyxl>=3.1",
  "pyarrow>=15",
  "plotly>=5.24",
  "matplotlib>=3.9",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "xarray>=2024.1",
  "netCDF4>=1.6",
  "statsmodels>=0.14",
  "scikit-learn>=1.4",
  "pytest>=8",
  "pytest-cov>=4",
  "ruff>=0.9",
  "build>=1.2",
]
[tool.hatch.build.targets.wheel]
packages = ["src/nielytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
ignore = ["RUF012"]
